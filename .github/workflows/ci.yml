name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i
      - run: deno check common/index.ts server/index.ts hooks/index.ts cloudflare/index.ts
      - run: deno test --allow-net
      - run: npx vitest run
      - run: npx wrangler deploy --dry-run
